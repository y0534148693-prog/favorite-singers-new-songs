name: Build and typecheck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xigjfarewkffelltbifl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gRitf6tK2XK09--297L4pg_zUjgg_Iv
      NEXT_PUBLIC_YOUTUBE_FEED_URL: https://xigjfarewkffelltbifl.supabase.co/functions/v1/youtube-feed
      NEXT_PUBLIC_YOUTUBE_SEARCH_URL: https://xigjfarewkffelltbifl.supabase.co/functions/v1/youtube-search
      NEXT_PUBLIC_YOUTUBE_SUBSCRIPTIONS_URL: https://xigjfarewkffelltbifl.supabase.co/functions/v1/youtube-subscriptions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Commit npm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add package-lock.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: add npm lockfile"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
