name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
          NEXT_PUBLIC_YOUTUBE_FEED_URL: https://example.supabase.co/functions/v1/youtube-feed
          NEXT_PUBLIC_YOUTUBE_SEARCH_URL: https://example.supabase.co/functions/v1/youtube-search
